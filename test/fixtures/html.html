<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Abyssal theme visual test"
  />

  <title>Abyssal Test</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  />
</head>

<body>
  <header class="site-header">
    <nav class="navigation">
      <a href="/" class="logo">
        Abyssal
      </a>

      <ul class="navigation-links">
        <li>
          <a href="/home">Home</a>
        </li>

        <li>
          <a href="/projects">Projects</a>
        </li>

        <li>
          <a href="/about">About</a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <span class="badge">
        Open Source
      </span>

      <h1>
        Build in the dark.
      </h1>

      <p>
        Abyssal is a developer-focused
        dark theme designed for long coding sessions.
      </p>

      <button type="button">
        Get Started
      </button>
    </section>

    <section class="users">
      <h2>Users</h2>

      <article class="user-card">
        <h3>Alice</h3>

        <p>
          alice@example.com
        </p>

        <span
          class="status status-active"
        >
          Active
        </span>
      </article>

      <article class="user-card">
        <h3>Bob</h3>

        <p>
          bob@example.com
        </p>

        <span
          class="status status-inactive"
        >
          Inactive
        </span>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <small>
      © 2026 Abyssal
    </small>
  </footer>
</body>
</html>
