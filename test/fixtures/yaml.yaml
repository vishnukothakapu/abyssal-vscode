# Abyssal YAML syntax highlighting fixture

name: abyssal
version: 0.1.0
description: >
  A developer-focused dark theme
  for long coding sessions.

project:
  name: Abyssal
  type: vscode-theme
  license: MIT

author:
  name: Vishnu Kothakapu
  website: https://example.com

features:
  semantic-highlighting: true
  terminal-colors: true
  git-decorations: true
  diagnostics: true

colors:
  background: "#070B14"
  surface: "#0F172A"
  foreground: "#D9E2F2"
  accent: "#67E8F9"
  success: "#86EFAC"
  warning: "#FDE68A"
  error: "#FB7185"

languages:
  - typescript
  - javascript
  - react
  - python
  - go
  - rust
  - java
  - html
  - css
  - json
  - yaml
  - sql
  - shell

environments:
  development:
    debug: true
    port: 3000

  production:
    debug: false
    port: 8080

database:
  host: localhost
  port: 5432
  name: abyssal

users:
  - id: 1
    name: Alice
    active: true

  - id: 2
    name: Bob
    active: false